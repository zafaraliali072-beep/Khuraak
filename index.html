<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Khuraak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column, summary ring on top, meal timeline below, tab bar at the bottom.
   Palette: true-black AMOLED dark with neutral greys, amber for calories and carbs, coral protein, teal fat. */
:root{
  --bg:#000000; --s1:#0e0e0e; --s2:#171717; --line:#262626;
  --fg:#ededed; --mute:#8e8e8e; --accent:#e9b44c; --ink:#000000;
  --prot:#ee7d62; --carb:#e9b44c; --fat:#62b6a4;
  --good:#6cc08b; --warn:#e9b44c; --bad:#e8675a;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf1ed; --s1:#ffffff; --s2:#f1f5f1; --line:#d6dfd7;
    --fg:#15201a; --mute:#5b6c60; --accent:#a86d00; --ink:#ffffff;
    --prot:#c44a2d; --carb:#a86d00; --fat:#23806e;
    --good:#2b8a50; --warn:#a86d00; --bad:#bf3a2b; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1ed; --s1:#ffffff; --s2:#f1f5f1; --line:#d6dfd7;
  --fg:#15201a; --mute:#5b6c60; --accent:#a86d00; --ink:#ffffff;
  --prot:#c44a2d; --carb:#a86d00; --fat:#23806e;
  --good:#2b8a50; --warn:#a86d00; --bad:#bf3a2b; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --s1:#0e0e0e; --s2:#171717; --line:#262626;
  --fg:#ededed; --mute:#8e8e8e; --accent:#e9b44c; --ink:#000000;
  --prot:#ee7d62; --carb:#e9b44c; --fat:#62b6a4;
  --good:#6cc08b; --warn:#e9b44c; --bad:#e8675a; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;padding-block:14px 108px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.daynav{display:flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px}
.daynav button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.daynav button:disabled{opacity:.3;cursor:default}
.daynav .lbl{min-width:92px;text-align:center;font-weight:600;font-size:13px}
.streak{font-size:12px;color:var(--mute);margin-top:2px}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:12px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sect h2{font-size:17px}
.sect span{font-size:12px;color:var(--mute)}

/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font-family:var(--display);font-size:27px;line-height:1}
.ring .t small{font-size:11px;color:var(--mute);margin-top:3px}
.macro{display:grid;gap:3px}
.macro + .macro{margin-top:9px}
.macro .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.macro .h b{color:var(--fg);font-weight:600}
.bar{height:7px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .35s ease}
.left{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.left b{color:var(--fg)}

/* next meal */
.next{display:flex;gap:12px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.next .when{font-family:var(--display);font-weight:700;font-size:20px;min-width:62px}
.next.late .when{color:var(--bad)}
.next small{display:block;color:var(--mute);font-size:12px}

/* meals */
.meal{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.meal.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.meal .head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;width:100%;text-align:left}
.time{font-family:var(--display);font-weight:700;font-size:14px;width:50px;color:var(--accent)}
.meal.done .time{color:var(--good)}
.meal .nm{font-weight:600;font-size:15px}
.meal .it{font-size:13px;color:var(--mute);margin-top:2px}
.meal.done .it{opacity:.7}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:.15s}
.meal.done .chk{background:var(--good);border-color:var(--good);color:var(--ink)}
.detail{padding:0 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--s2);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.mini b{color:var(--fg)}
.mini .p b{color:var(--prot)} .mini .c b{color:var(--carb)} .mini .f b{color:var(--fat)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700}
.btn.ghost{background:var(--s2);color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* water */
.water .big{font-family:var(--display);font-size:26px;font-weight:700}
.drops{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin:10px 0 12px}
.drops i{height:20px;border-radius:5px;background:var(--s2)}
.drops i.on{background:var(--fat)}

/* habit list */
.hab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.hab:last-child{border-bottom:0}
.hab .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.hab.on .box{background:var(--good);border-color:var(--good);color:var(--ink)}
.hab small{display:block;color:var(--mute);font-size:12px}

/* extras */
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ex:last-child{border-bottom:0}

/* micro list */
.mi{padding:12px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mi .l b{font-weight:600}
.mi small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mute)}
.pill.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}

/* forms */
label.f{display:grid;gap:5px;font-size:12px;color:var(--mute);font-weight:600}
input[type=text],input[type=number],input[type=time],textarea{width:100%;background:var(--s2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--s2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:20px}
.stat small{font-size:11px;color:var(--mute)}
.note{background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px}
.note.good{border-left:3px solid var(--good)} .note.warn{border-left:3px solid var(--warn)} .note.bad{border-left:3px solid var(--bad)}

/* shopping */
.shop{display:grid;grid-template-columns:auto 1fr auto 92px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop.on .nm{color:var(--mute);text-decoration:line-through}
.shop input{padding:7px 9px;font-size:14px;text-align:right}
.shop .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:12px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;pointer-events:none}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--s1);color:var(--fg);box-shadow:0 1px 0 var(--line)}
@media (max-width:380px){.hero{grid-template-columns:112px 1fr}.ring{width:112px;height:112px}.shop{grid-template-columns:auto 1fr auto 78px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------- plan data ---------- */
var MEALS=[
 {id:"m1",time:"06:00",name:"Subah ka nashta",items:"3 egg bhurji (1 tsp oil) · 2 roti · 1 banana",p:27,c:78,f:20,
  mi:{fe:3,ca:90,b12:1.2,zn:2,mg:70,k:600,vc:10,fib:5}},
 {id:"m2",time:"07:30",name:"Kaam pe jaane se pehle",items:"Dahi 80g · peanuts 35g",p:12,c:10,f:19,
  mi:{fe:1.5,ca:90,b12:.3,zn:1.5,mg:75,k:380,vc:0,fib:3}},
 {id:"m3",time:"12:30",name:"Halka khana",items:"Roasted chana 40g · 1 glass milk (200ml)",p:14,c:34,f:9,
  mi:{fe:2.5,ca:220,b12:.9,zn:1.5,mg:70,k:520,vc:0,fib:6}},
 {id:"m4",time:"13:30",name:"Lunch",items:"1.5 cup chawal (~300g pakka) · soya chunks 30g (dry) · dal 1 katori · salad/sabzi (2 tsp oil)",p:30,c:80,f:18,
  mi:{fe:6,ca:100,b12:0,zn:3,mg:110,k:750,vc:20,fib:8}},
 {id:"m5",time:"17:30",name:"Shaam ka khana",items:"Chana chaat (50g dry chana) · dahi 80g · nimbu",p:13,c:34,f:6,
  mi:{fe:3,ca:90,b12:.3,zn:2,mg:55,k:520,vc:12,fib:7}},
 {id:"m6",time:"18:30",name:"Gym se pehle",items:"1 banana · 4 khajoor",p:2,c:43,f:0,
  mi:{fe:1,ca:30,b12:0,zn:.3,mg:40,k:750,vc:9,fib:5}},
 {id:"m7",time:"20:30",name:"Gym ke baad",items:"2 boiled eggs · shake: milk 300ml + peanuts 20g + 2 khajoor",p:27,c:30,f:29,
  mi:{fe:2,ca:280,b12:1.4,zn:2.5,mg:90,k:700,vc:0,fib:3}},
 {id:"m8",time:"22:30",name:"Raat ka khana",items:"5 roti · soya sabzi (25g dry, lauki/tori, 1 tsp oil)",p:29,c:138,f:11,
  mi:{fe:3,ca:80,b12:.3,zn:2,mg:80,k:450,vc:15,fib:5}}
];
MEALS.forEach(function(m){m.kcal=Math.round(4*m.p+4*m.c+9*m.f)});

var MICRO=[
 {k:"fe",n:"Iron",u:"mg",t:17,s:"Soya, chana, dal, khajoor"},
 {k:"ca",n:"Calcium",u:"mg",t:1000,s:"Milk, dahi"},
 {k:"b12",n:"Vitamin B12",u:"mcg",t:2.4,s:"Eggs, milk, dahi"},
 {k:"zn",n:"Zinc",u:"mg",t:12,s:"Soya, chana, peanuts, eggs"},
 {k:"mg",n:"Magnesium",u:"mg",t:400,s:"Peanuts, chana, soya, banana"},
 {k:"k",n:"Potassium",u:"mg",t:3500,s:"Banana, dahi, milk, khajoor"},
 {k:"vc",n:"Vitamin C",u:"mg",t:80,s:"Nimbu, salad, sabzi. Yahan sabse zyada kami hoti hai"},
 {k:"fib",n:"Fibre",u:"g",t:40,s:"Chana, dal, roti, sabzi"}
];
var HABITS=[
 {id:"nimbu",n:"Nimbu / amla / orange",s:"Vitamin C, iron ka absorption badhta hai",add:{vc:30}},
 {id:"salad",n:"Salad (kheera, tamatar)",s:"Vitamin C + fibre",add:{vc:15,fib:3}},
 {id:"sabzi",n:"Palak ya gajar sabzi",s:"Vitamin A",flag:"Vitamin A"},
 {id:"dhoop",n:"15 min dhoop",s:"Vitamin D (subah 7:30 se 10 ke beech)",flag:"Vitamin D"},
 {id:"namak",n:"Nimbu paani + chutki namak",s:"Cycle ke baad electrolytes",flag:"Electrolytes"},
 {id:"alsi",n:"1 tsp alsi dahi mein",s:"Omega-3",flag:"Omega-3"}
];
var PRESETS=[
 {n:"1 anda",p:6,c:.5,f:5},{n:"1 roti",p:3,c:24,f:1},{n:"1 banana",p:1,c:27,f:0},
 {n:"1 glass milk",p:6.5,c:9.5,f:7},{n:"Dahi 100g",p:3.5,c:5,f:4},{n:"Peanuts 30g",p:8,c:5,f:15},
 {n:"2 khajoor",p:.5,c:12,f:0},{n:"Chawal 1 katori",p:3,c:42,f:.3}
];
var GROC=[
 {id:"egg",n:"Eggs",d:5,u:"pc"},{id:"milk",n:"Milk",d:500,u:"ml"},{id:"dahi",n:"Dahi",d:160,u:"g"},
 {id:"pnut",n:"Peanuts",d:55,u:"g"},{id:"soya",n:"Soya chunks",d:55,u:"g"},{id:"chana",n:"Chana (roasted + kaala)",d:90,u:"g"},
 {id:"rice",n:"Chawal (kaccha)",d:100,u:"g"},{id:"atta",n:"Atta (7 roti)",d:245,u:"g"},{id:"dal",n:"Dal (kaccha)",d:30,u:"g"},
 {id:"banana",n:"Banana",d:2,u:"pc"},{id:"khajoor",n:"Khajoor",d:50,u:"g"},{id:"oil",n:"Oil",d:20,u:"ml"},
 {id:"sabzi",n:"Sabzi + salad",d:300,u:"g"},{id:"nimbu",n:"Nimbu",d:1.34,u:"pc"},{id:"alsi",n:"Alsi (optional)",d:5,u:"g"}
];

/* ---------- state ---------- */
var KEY="khuraak.v1";
function pad(n){return n<10?"0"+n:""+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return dkey(new Date())}
function parseKey(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)}
function defaults(){return{settings:{kcal:3400,protein:154,water:4500,startWeight:59,startDate:todayKey(),height:165,theme:"auto",notif:false,times:{},listDays:30},days:{},bought:{},spend:{}}}
function load(){
  var d=defaults();
  try{var j=JSON.parse(localStorage.getItem(KEY)||"null");
    if(j&&typeof j==="object"){
      for(var k in j.settings||{})d.settings[k]=j.settings[k];
      d.days=j.days||{};d.bought=j.bought||{};d.spend=j.spend||{};
    }
  }catch(e){}
  return d;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function getDay(k){
  if(!S.days[k])S.days[k]={meals:{},extras:[],water:0,checks:{},weight:null};
  var d=S.days[k];if(!d.meals)d.meals={};if(!d.extras)d.extras=[];if(!d.checks)d.checks={};
  return d;
}
function peekDay(k){return S.days[k]||null}
function mealTime(m){return (S.settings.times&&S.settings.times[m.id])||m.time}

var ui={tab:"today",day:todayKey(),open:null,sheet:false,confirmReset:false,exportText:"",importMsg:""};

/* ---------- native (Android app) hooks, ignored on the web ---------- */
var CAP=window.Capacitor||null;
var NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
var PL=(NATIVE&&CAP.Plugins)||{};
var LN=PL.LocalNotifications||null;
var SB=PL.StatusBar||null;
function scheduleNative(){
  if(!LN)return Promise.resolve();
  var ids=MEALS.map(function(m,i){return{id:i+1}});
  return LN.cancel({notifications:ids}).catch(function(){}).then(function(){
    if(!S.settings.notif)return;
    return LN.schedule({notifications:MEALS.map(function(m,i){
      var t=mealTime(m).split(":");
      return{id:i+1,title:m.name+" ka time",body:m.items,smallIcon:"ic_stat_khuraak",iconColor:"#E9B44C",
        schedule:{on:{hour:+t[0],minute:+t[1]},allowWhileIdle:true}};
    })});
  }).catch(function(){});
}
function nativeBars(){
  if(!SB)return;
  try{
    var t=S.settings.theme,dark=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
    SB.setBackgroundColor({color:dark?"#000000":"#edf1ed"});
    SB.setStyle({style:dark?"DARK":"LIGHT"});
  }catch(e){}
}

/* ---------- calculations ---------- */
function totals(day){
  var t={kcal:0,p:0,c:0,f:0,mi:{},flags:{}};
  MICRO.forEach(function(x){t.mi[x.k]=0});
  if(!day)return t;
  MEALS.forEach(function(m){
    var st=day.meals[m.id];if(!st||!st.done)return;
    var x=st.mult||1;
    t.p+=m.p*x;t.c+=m.c*x;t.f+=m.f*x;
    MICRO.forEach(function(q){t.mi[q.k]+=(m.mi[q.k]||0)*x});
  });
  (day.extras||[]).forEach(function(e){t.p+=e.p||0;t.c+=e.c||0;t.f+=e.f||0;t.kcal+=e.kcal||0});
  var mealKcal=0;
  MEALS.forEach(function(m){var st=day.meals[m.id];if(st&&st.done)mealKcal+=m.kcal*(st.mult||1)});
  t.kcal+=mealKcal;
  HABITS.forEach(function(h){
    if(!day.checks[h.id])return;
    if(h.add)for(var k in h.add)t.mi[k]+=h.add[k];
    if(h.flag)t.flags[h.flag]=true;
  });
  return t;
}
function planTotals(){
  var t={kcal:0,p:0,c:0,f:0};
  MEALS.forEach(function(m){t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.f+=m.f});return t;
}
function r0(n){return Math.round(n)}
function r1(n){return Math.round(n*10)/10}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayLabel(k){
  var t=todayKey();
  if(k===t)return "Aaj";
  if(k===addDays(t,-1))return "Kal";
  return parseKey(k).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
}
function goodDay(k){
  var d=peekDay(k);if(!d)return false;
  return totals(d).kcal>=S.settings.kcal*0.85;
}
function streak(){
  var k=todayKey(),n=0;
  if(!goodDay(k))k=addDays(k,-1);
  while(goodDay(k)){n++;k=addDays(k,-1)}
  return n;
}

function macroBar(n,v,t,col){
  var w=t>0?Math.min(100,v/t*100):0;
  return '<div class="macro"><div class="h"><span>'+n+'</span><span class="num"><b>'+r0(v)+'</b> / '+t+' g</span></div><div class="bar" style="--c:'+col+'"><i style="width:'+w.toFixed(1)+'%"></i></div></div>';
}
function toMin(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function nextMealHtml(day){
  var now=new Date(),nm=now.getHours()*60+now.getMinutes();
  var left=MEALS.filter(function(m){return !(day.meals[m.id]&&day.meals[m.id].done)});
  if(!left.length)return '<div class="sect" style="margin-top:14px"></div><div class="next"><div class="when" style="color:var(--good)">✓</div><div><b>Aaj ka plan poora</b><small>Paani aur aadatein neeche check kar lo</small></div></div>';
  var up=left.filter(function(m){return toMin(mealTime(m))>=nm})[0],late=left.filter(function(m){return toMin(mealTime(m))<nm});
  var m,cls="",txt,sub;
  if(late.length&&(!up||late.length>0)){
    m=late[late.length-1];var diff=nm-toMin(mealTime(m));
    cls=" late";txt=diff<60?diff+" min":Math.floor(diff/60)+"h "+(diff%60)+"m";sub="late · "+esc(m.name)+" abhi baaki hai";
    if(up&&diff>90){m=up;var d2=toMin(mealTime(m))-nm;cls="";txt=d2<60?d2+" min":Math.floor(d2/60)+"h "+(d2%60)+"m";sub="baad · "+esc(m.name)+" "+mealTime(m)}
  }else{m=up;var d3=toMin(mealTime(m))-nm;txt=d3<60?d3+" min":Math.floor(d3/60)+"h "+(d3%60)+"m";sub="baad · "+esc(m.name)+" "+mealTime(m)}
  return '<div style="height:12px"></div><div class="next'+cls+'"><div class="when num">'+txt+'</div><div><b>'+(cls?'Late hai':'Agla khana')+'</b><small>'+sub+'</small></div></div>';
}

function weightSeries(){
  var s=S.settings,pts=[];
  Object.keys(S.days).sort().forEach(function(k){var w=S.days[k].weight;if(w)pts.push({k:k,w:w})});
  if(!pts.length||pts[0].k>s.startDate)pts.unshift({k:s.startDate,w:s.startWeight});
  return pts;
}
function slopePerWeek(pts){
  var recent=pts.slice(-8);if(recent.length<3)return null;
  var x0=parseKey(recent[0].k).getTime(),xs=recent.map(function(p){return(parseKey(p.k).getTime()-x0)/864e5}),ys=recent.map(function(p){return p.w});
  if(xs[xs.length-1]<6)return null;
  var n=xs.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxy+=xs[i]*ys[i];sxx+=xs[i]*xs[i]}
  var den=n*sxx-sx*sx;return den?(n*sxy-sx*sy)/den*7:null;
}
function weightChart(pts){
  var s=S.settings,W=340,H=180,L=34,R=10,T=12,B=24;
  var first=parseKey(pts[0].k).getTime(),last=Math.max(parseKey(pts[pts.length-1].k).getTime(),parseKey(todayKey()).getTime());
  var span=Math.max(last-first,7*864e5);
  var tgt=function(t){return s.startWeight+(t-parseKey(s.startDate).getTime())/864e5/7*.5};
  var ws=pts.map(function(p){return p.w}).concat([tgt(first),tgt(first+span)]);
  var mn=Math.floor(Math.min.apply(null,ws)*2-1)/2,mx=Math.ceil(Math.max.apply(null,ws)*2+1)/2;
  var X=function(t){return L+(t-first)/span*(W-L-R)},Y=function(w){return T+(mx-w)/(mx-mn)*(H-T-B)};
  var g="";
  for(var i=0;i<=3;i++){var v=mn+(mx-mn)*i/3;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+r1(v)+'</text>'}
  var line=pts.map(function(p,i){return(i?"L":"M")+X(parseKey(p.k).getTime()).toFixed(1)+" "+Y(p.w).toFixed(1)}).join(" ");
  var dots=pts.map(function(p){return '<circle cx="'+X(parseKey(p.k).getTime()).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="3.2" fill="var(--fg)"/>'}).join("");
  var lastP=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight chart">'+g+
   '<path d="M'+X(first).toFixed(1)+' '+Y(tgt(first)).toFixed(1)+' L'+X(first+span).toFixed(1)+' '+Y(tgt(first+span)).toFixed(1)+'" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>'+
   '<path d="'+line+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>'+dots+
   '<text x="'+(W-R)+'" y="'+(Y(lastP.w)-8).toFixed(1)+'" text-anchor="end" style="fill:var(--fg);font-weight:700;font-size:11px">'+lastP.w+' kg</text>'+
   '<text x="'+L+'" y="'+(H-6)+'">'+parseKey(pts[0].k).toLocaleDateString("en-IN",{day:"numeric",month:"short"})+'</text>'+
   '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+new Date(last).toLocaleDateString("en-IN",{day:"numeric",month:"short"})+'</text></svg>';
}
function calChart(){
  var s=S.settings,W=340,H=150,L=8,R=8,T=10,B=20,n=14,keys=[],i;
  for(i=n-1;i>=0;i--)keys.push(addDays(todayKey(),-i));
  var vals=keys.map(function(k){return totals(peekDay(k)).kcal});
  var mx=Math.max(s.kcal*1.15,Math.max.apply(null,vals)),bw=(W-L-R)/n,out="";
  keys.forEach(function(k,i){
    var v=vals[i],h=(v/mx)*(H-T-B),x=L+i*bw+bw*.16,w=bw*.68,col=v>=s.kcal*.9?"var(--good)":v>0?"var(--accent)":"var(--line)";
    out+='<rect x="'+x.toFixed(1)+'" y="'+(H-B-Math.max(h,2)).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,2).toFixed(1)+'" rx="3" fill="'+col+'"/>';
    out+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+parseKey(k).getDate()+'</text>';
  });
  var ty=H-B-(s.kcal/mx)*(H-T-B);
  out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="var(--fg)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/><text x="'+(W-R)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end">'+s.kcal+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pichhle 14 din ki calories">'+out+'</svg>';
}
function viewProg(){
  var s=S.settings,pts=weightSeries(),cur=pts[pts.length-1],today=getDay(todayKey()),sl=slopePerWeek(pts);
  var gain=r1(cur.w-s.startWeight);
  var h='<div class="top"><div><div class="brand">progress<i>.</i></div><div class="streak">Target: hafte mein +0.5 kg</div></div></div>';
  h+='<div class="card"><div class="stat"><div><b class="num">'+cur.w+'</b><small>abhi kg</small></div><div><b class="num">'+(gain>0?"+":"")+gain+'</b><small>shuru se kg</small></div><div><b class="num">'+(sl===null?"–":(sl>0?"+":"")+r1(sl))+'</b><small>kg / hafta</small></div></div>'+
    weightChart(pts)+
    '<div class="mute" style="font-size:12px;margin-top:6px"><span style="color:var(--accent)">- - -</span> target &nbsp; <span style="color:var(--fg)">●</span> tumhara weight</div>'+
    '<div class="grid2" style="margin-top:14px;align-items:end"><label class="f">Aaj ka weight (kg)<input id="wIn" type="number" inputmode="decimal" step="0.1" min="30" max="150" placeholder="'+(today.weight||cur.w)+'" value="'+(today.weight||"")+'"></label><button class="btn" data-act="saveweight">Save</button></div>'+
    '<div class="mute" style="font-size:12px;margin-top:8px">Subah toilet ke baad, khaane se pehle, roz same kaante pe.</div></div>';
  var adv;
  if(sl===null)adv='<div class="note">Advice ke liye 1 hafte tak 3-4 baar weight daalo. Abhi data kam hai.</div>';
  else if(sl<.25)adv='<div class="note warn"><b>Weight dheere badh raha hai.</b> Roz ek roti + 1 glass milk (~+300 kcal) add karo aur 2 hafte baad phir dekho.</div>';
  else if(sl<=.7)adv='<div class="note good"><b>Bilkul sahi chal raha hai.</b> Plan jaisa hai waisa hi rakho.</div>';
  else adv='<div class="note warn"><b>Thoda tez badh raha hai.</b> Peanuts ya chawal thoda kam karo (~200-300 kcal), nahi to fat zyada judega.</div>';
  h+='<div style="height:12px"></div>'+adv;

  var keys=[],i,hit=0,sum=0,cnt=0;
  for(i=0;i<14;i++)keys.push(addDays(todayKey(),-i));
  keys.forEach(function(k){var d=peekDay(k);if(d){var t=totals(d);if(t.kcal>0){cnt++;sum+=t.kcal;if(t.kcal>=s.kcal*.9&&t.p>=s.protein*.9)hit++}}});
  h+='<div class="sect"><h2>Pichhle 14 din</h2><span>calories</span></div><div class="card"><div class="stat"><div><b class="num">'+(cnt?r0(sum/cnt):"–")+'</b><small>avg kcal</small></div><div><b class="num">'+hit+'/14</b><small>target wale din</small></div><div><b class="num">'+streak()+'</b><small>din streak</small></div></div>'+calChart()+'</div>';
  return h;
}

function fmtQty(g,days){
  var v=g.d*days;
  if(g.u==="g")return v>=1000?r1(v/1000)+" kg":r0(v)+" g";
  if(g.u==="ml")return v>=1000?r1(v/1000)+" L":r0(v)+" ml";
  if(g.id==="egg"&&days>=6)return r0(v)+" ("+r1(v/12)+" dozen)";
  return r0(v)+" pc";
}

  });
  h+='</div><div style="height:12px"></div><div class="card row spread"><div><b>Kul kharcha</b><div class="mute" style="font-size:12px">Jo ₹ tum bharo uska jod</div></div><div style="font-family:var(--display);font-size:24px;font-weight:700" class="num">₹'+r0(total)+'</div></div>';
  h+='<div class="mute" style="font-size:12px;margin:12px 2px">Masale aur namak alag se. Kharcha apne local rate se khud bharo, app koi rate nahi maanta.</div>';
  return h;
}

function viewMore(){
  var s=S.settings,h='<div class="top"><div><div class="brand">aur<i>.</i></div><div class="streak">Targets, timing, backup</div></div></div>';
  h+='<div class="card stack"><h3>Targets</h3><div class="grid3"><label class="f">Calories<input type="number" inputmode="numeric" data-chg="set" data-k="kcal" value="'+s.kcal+'"></label><label class="f">Protein (g)<input type="number" inputmode="numeric" data-chg="set" data-k="protein" value="'+s.protein+'"></label><label class="f">Paani (ml)<input type="number" inputmode="numeric" data-chg="set" data-k="water" value="'+s.water+'"></label></div>'+
    '<div class="grid2"><label class="f">Shuru ka weight (kg)<input type="number" inputmode="decimal" step="0.1" data-chg="set" data-k="startWeight" value="'+s.startWeight+'"></label><label class="f">Shuru ki date<input type="text" data-chg="set" data-k="startDate" value="'+s.startDate+'" placeholder="YYYY-MM-DD"></label></div></div>';
  h+='<div style="height:12px"></div><div class="card stack"><h3>Khane ka time</h3><div class="grid2">'+MEALS.map(function(m){return '<label class="f">'+esc(m.name)+'<input type="time" data-chg="time" data-id="'+m.id+'" value="'+mealTime(m)+'"></label>'}).join("")+'</div></div>';
  h+='<div style="height:12px"></div><div class="card stack"><h3>Reminder</h3><div class="row spread"><div class="grow"><b>Khane ka notification</b><div class="mute" style="font-size:12px">'+(NATIVE?'App band ho tab bhi, har meal ke time pe aayega':'Sirf tab chalta hai jab app khula ho')+'</div></div><button class="btn sm '+(s.notif?'':'ghost')+'" data-act="notif">'+(s.notif?'On':'Off')+'</button></div></div>';
  h+='<div style="height:12px"></div><div class="card stack"><h3>Theme</h3><div class="seg">'+[["auto","Auto"],["dark","Dark"],["light","Light"]].map(function(o){return '<button class="'+(s.theme===o[0]?'on':'')+'" data-act="theme" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div></div>';
  h+='<div style="height:12px"></div><div class="card stack"><h3>Backup</h3><div class="mute" style="font-size:13px">Data sirf is phone ke browser mein hai. Kabhi kabhi backup copy kar lo.</div>'+
    '<div class="row"><button class="btn ghost sm grow" data-act="export">Backup banao</button><button class="btn ghost sm grow" data-act="import">Restore karo</button></div>'+
    (ui.exportText!==""?'<textarea id="bk" aria-label="Backup data">'+esc(ui.exportText)+'</textarea><div class="row"><button class="btn sm grow" data-act="copybk">Copy</button>'+(NATIVE?'':'<button class="btn ghost sm grow" data-act="savebk">File save</button>')+'<button class="btn ghost sm grow" data-act="dobackimport">Restore</button></div>':'')+
    (ui.importMsg?'<div class="note">'+esc(ui.importMsg)+'</div>':'')+'</div>';
  h+='<div style="height:12px"></div><div class="card stack"><h3>Reset</h3>'+(ui.confirmReset?'<div class="note bad">Saara data mit jayega. Pakka?</div><div class="row"><button class="btn bad sm grow" data-act="reset">Haan, mita do</button><button class="btn ghost sm grow" data-act="resetno">Nahi</button></div>':'<button class="btn ghost sm" data-act="resetask">Saara data mitao</button>')+'</div>';
  var pt=planTotals();
  h+='<div class="mute" style="font-size:12px;margin:14px 2px">Plan: '+pt.kcal+' kcal · '+pt.p+'g protein · '+pt.c+'g carbs · '+pt.f+'g fat. Numbers andaaze hain, brand aur banane ke tareeke se thode alag ho sakte hain.</div>';
  return h;
}

function sheetHtml(){
  return '<div class="scrim" data-act="sheetbg"><div class="sheet" role="dialog" aria-label="Extra khana"><div class="row spread"><h3>Extra khana</h3><button class="btn ghost sm" data-act="sheetx">Band</button></div>'+
   '<div class="chips">'+PRESETS.map(function(p,i){return '<button class="chip" data-act="preset" data-i="'+i+'">'+esc(p.n)+'</button>'}).join("")+'</div>'+
   '<label class="f">Naam<input id="xn" type="text" placeholder="Jaise: samosa"></label>'+
   '<div class="grid2"><label class="f">Protein (g)<input id="xp" type="number" inputmode="decimal" min="0"></label><label class="f">Carbs (g)<input id="xc" type="number" inputmode="decimal" min="0"></label><label class="f">Fat (g)<input id="xf" type="number" inputmode="decimal" min="0"></label><label class="f">Kcal (khali = auto)<input id="xk" type="number" inputmode="decimal" min="0"></label></div>'+
   '<button class="btn block" data-act="addex">Add karo</button></div></div>';
}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById("app"),y=window.scrollY;
  var v={today:viewToday,micro:viewMicro,prog:viewProg,shop:viewShop,more:viewMore}[ui.tab]();
  app.innerHTML=v+(ui.sheet?sheetHtml():"");
  document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(ui.tab===t[0]?'on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[2]+t[1]+'</button>'}).join("");
  applyTheme();
  if(window.scrollY!==y)window.scrollTo(0,y);
}
function applyTheme(){
  var el=document.documentElement,t=S.settings.theme;
  if(t==="auto")el.removeAttribute("data-theme");else el.setAttribute("data-theme",t);
  if(applyTheme._last!==t){applyTheme._last=t;nativeBars()}
}
function toast(msg){
  var host=document.getElementById("toastHost");host.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t);toast._t=setTimeout(function(){host.innerHTML=""},1700);
}

/* ---------- actions ---------- */
function addExtra(e){var d=getDay(ui.day);d.extras.push(e);save()}
function act(a,el,ev){
  var d=el.dataset,day=getDay(ui.day),s=S.settings;
  switch(a){
    case "tab":ui.tab=d.v;ui.sheet=false;window.scrollTo(0,0);break;
    case "dayprev":ui.day=addDays(ui.day,-1);ui.open=null;break;
    case "daynext":if(ui.day<todayKey())ui.day=addDays(ui.day,1);ui.open=null;break;
    case "daytoday":ui.day=todayKey();ui.open=null;break;
    case "open":ui.open=ui.open===d.id?null:d.id;break;
    case "meal":{var st=day.meals[d.id]||(day.meals[d.id]={});st.done=!st.done;if(!st.mult)st.mult=1;save();break}
    case "mult":{var st2=day.meals[d.id]||(day.meals[d.id]={});st2.mult=+d.v;st2.done=true;save();break}
    case "water":day.water=Math.max(0,(day.water||0)+ +d.v);save();break;
    case "habit":day.checks[d.id]=!day.checks[d.id];save();break;
    case "sheet":ui.sheet=true;break;
    case "sheetx":ui.sheet=false;break;
    case "sheetbg":if(ev.target===el)ui.sheet=false;else return;break;
    case "preset":{var p=PRESETS[+d.i];addExtra({n:p.n,p:p.p,c:p.c,f:p.f,kcal:Math.round(4*p.p+4*p.c+9*p.f)});toast(p.n+" add ho gaya");break}
    case "addex":{
      var n=document.getElementById("xn").value.trim()||"Extra";
      var P=+document.getElementById("xp").value||0,C=+document.getElementById("xc").value||0,F=+document.getElementById("xf").value||0,K=+document.getElementById("xk").value;
      if(!K)K=Math.round(4*P+4*C+9*F);
      if(!K){toast("Kuch values daalo");return}
      addExtra({n:n,p:P,c:C,f:F,kcal:K});ui.sheet=false;toast("Add ho gaya");break}
    case "delex":day.extras.splice(+d.i,1);save();break;
    case "saveweight":{
      var w=parseFloat(document.getElementById("wIn").value);
      if(!(w>=30&&w<=150)){toast("Sahi weight daalo");return}
      getDay(todayKey()).weight=Math.round(w*10)/10;save();toast("Weight save ho gaya");break}
    case "listdays":s.listDays=+d.v;save();break;
    case "bought":S.bought[d.id]=!S.bought[d.id];save();break;
    case "theme":s.theme=d.v;save();break;
    case "notif":toggleNotif();return;
    case "export":ui.exportText=JSON.stringify(S);ui.importMsg="";break;
    case "import":ui.exportText=" ";ui.importMsg="Backup yahan paste karo, phir Restore dabao.";break;
    case "copybk":copyBk();return;
    case "savebk":saveBk();return;
    case "dobackimport":doImport();break;
    case "resetask":ui.confirmReset=true;break;
    case "resetno":ui.confirmReset=false;break;
    case "reset":S=defaults();save();ui.confirmReset=false;ui.exportText="";toast("Data mit gaya");break;
    default:return;
  }
  render();
}
function toggleNotif(){
  var s=S.settings;
  if(s.notif){s.notif=false;save();scheduleNative();render();return}
  if(LN){
    LN.requestPermissions().then(function(r){
      if(r&&r.display==="granted"){s.notif=true;save();scheduleNative();toast("Reminder on")}else toast("Notification ki permission nahi mili");
      render();
    }).catch(function(){toast("Notification nahi chal paya")});
    return;
  }
  if(!("Notification" in window)){toast("Is browser mein notification nahi hai");return}
  Notification.requestPermission().then(function(p){
    if(p==="granted"){s.notif=true;save();toast("Reminder on")}else toast("Permission nahi mili");
    render();
  }).catch(function(){toast("Notification nahi chal paya")});
}
function copyBk(){
  var ta=document.getElementById("bk");if(!ta)return;
  var done=function(){toast("Copy ho gaya")},fail=function(){ta.select();toast("Select kiya, ab copy karo")};
  try{navigator.clipboard.writeText(ta.value).then(done,fail)}catch(e){fail()}
}
function saveBk(){
  try{
    var b=new Blob([ui.exportText],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="khuraak-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast("File save nahi hui, Copy use karo")}
}
function doImport(){
  var ta=document.getElementById("bk");if(!ta)return;
  try{
    var j=JSON.parse(ta.value);if(!j||!j.days||!j.settings)throw 0;
    var d=defaults();for(var k in j.settings)d.settings[k]=j.settings[k];
    d.days=j.days;d.bought=j.bought||{};d.spend=j.spend||{};S=d;save();ui.exportText="";ui.importMsg="Restore ho gaya";
  }catch(e){ui.importMsg="Ye backup sahi nahi hai. Poora text paste karo."}
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="open"&&e.target.closest('[data-act="meal"]'))return;
  act(el.dataset.act,el,e);
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("role")==="button"){e.preventDefault();e.target.click()}
});
document.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.chg)return;
  var s=S.settings,kind=el.dataset.chg;
  if(kind==="spend"){var v=parseFloat(el.value);if(v>0)S.spend[el.dataset.id]=v;else delete S.spend[el.dataset.id];save();render()}
  else if(kind==="set"){
    var k=el.dataset.k;
    if(k==="startDate"){if(/^\d{4}-\d{2}-\d{2}$/.test(el.value))s.startDate=el.value;else toast("Format: YYYY-MM-DD")}
    else{var n=parseFloat(el.value);if(n>0)s[k]=n}
    save();render();
  }else if(kind==="time"){
    if(el.value){s.times[el.dataset.id]=el.value;save();if(s.notif)scheduleNative();toast("Time badal gaya")}
  }
});

/* reminders (only while app is open) */
var notified={};
setInterval(function(){
  var s=S.settings;
  if(NATIVE||!s.notif||!("Notification" in window)||Notification.permission!=="granted")return;
  var now=new Date(),hm=pad(now.getHours())+":"+pad(now.getMinutes()),k=todayKey(),day=peekDay(k);
  MEALS.forEach(function(m){
    var id=k+m.id;
    if(mealTime(m)===hm&&!notified[id]&&!(day&&day.meals[m.id]&&day.meals[m.id].done)){
      notified[id]=1;try{new Notification(m.name+" ka time",{body:m.items})}catch(e){}
    }
  });
},20000);
/* keep "next meal" fresh */
setInterval(function(){if(ui.tab==="today"&&ui.day===todayKey()&&!ui.sheet&&document.visibilityState==="visible"&&!document.activeElement.matches("input,textarea"))render()},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(ui.day>todayKey())ui.day=todayKey();render()}});

try{if(!NATIVE&&"serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&location.pathname.indexOf("artifact")<0)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}

if(S.settings.notif)scheduleNative();
render();
})();
</script>

</body>
